<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MindEase Login</title>

    <style>

        body {

            margin: 0;
            padding: 0;

            font-family: Arial, sans-serif;

            background: #0f172a;

            display: flex;

            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .container {

            background: #1e293b;

            padding: 40px;

            border-radius: 16px;

            width: 350px;

            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        h1 {

            color: white;

            text-align: center;

            margin-bottom: 30px;
        }

        input {

            width: 100%;

            padding: 12px;

            margin-bottom: 15px;

            border: none;

            border-radius: 8px;
        }

        button {

            width: 100%;

            padding: 12px;

            background: #3b82f6;

            border: none;

            color: white;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;
        }

        p {

            color: white;

            text-align: center;

            margin-top: 20px;
        }

        a {

            color: #60a5fa;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>MindEase Login</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div style="background: {% if category == 'danger' %}#ef4444{% else %}#22c55e{% endif %}; color: white; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 14px;">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">

            <input type="email"
                   name="email"
                   placeholder="Email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="/register">
                Register
            </a>
        </p>

    </div>

</body>

</html>
